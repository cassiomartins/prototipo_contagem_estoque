<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Compras App - PDF</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --p: #27ae60; --bg: #f0f2f5; --danger: #e74c3c; --blue: #3498db; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 10px; padding-bottom: 120px; }
        
        .header { 
            position: sticky; top: 0; background: var(--p); color: white; 
            padding: 20px; border-radius: 0 0 20px 20px; text-align: center; 
            margin: -10px -10px 20px -10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); z-index: 100;
        }
        
        .total-val { font-size: 2.2rem; font-weight: 800; display: block; }
        
        .item-card { 
            background: white; border-radius: 12px; padding: 15px; margin-bottom: 10px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .item-info { display: flex; align-items: center; flex: 1; }
        .item-info input[type="checkbox"] { width: 24px; height: 24px; margin-right: 15px; accent-color: var(--p); }
        .strikethrough { text-decoration: line-through; color: #bbb; }

        .price-tag { font-weight: bold; color: var(--p); font-size: 1.1rem; }

        .controls { 
            position: fixed; bottom: 0; left: 0; right: 0; background: white;
            display: flex; justify-content: space-around; padding: 15px 10px; gap: 8px;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.05);
        }

        button { 
            border: none; border-radius: 12px; padding: 12px; 
            font-weight: bold; font-size: 0.9rem; cursor: pointer;
        }

        .btn-add { background: var(--p); color: white; flex: 2; }
        .btn-pdf { background: var(--blue); color: white; flex: 1.5; }
        .btn-reset { background: #eee; color: var(--danger); flex: 1; }

        /* Estilo do Modal */
        #modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.5); z-index: 200; align-items: center; justify-content: center;
        }
        .modal-content { background: white; padding: 25px; border-radius: 20px; width: 85%; max-width: 400px; }
        .modal-content input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; font-size: 1.1rem; box-sizing: border-box; }

        /* Área invisível que será o PDF */
        #pdf-template { display: none; padding: 40px; color: black; }
    </style>
</head>
<body>

<div class="header">
    <span style="opacity: 0.9;">Total Marcado</span>
    <span class="total-val">R$ <span id="display-total">0,00</span></span>
</div>

<div id="lista-container"></div>

<div class="controls">
    <button class="btn-reset" onclick="reiniciarLista()">Zerar</button>
    <button class="btn-pdf" onclick="gerarPDF()">Finalizar</button>
    <button class="btn-add" onclick="abrirModal()">+ Item</button>
</div>

<div id="pdf-area" style="display: none;">
    <h1 style="color: #27ae60;">Relatório de Compras - Bruno</h1>
    <p id="pdf-data"></p>
    <hr>
    <table style="width: 100%; border-collapse: collapse;" id="pdf-table">
        <thead>
            <tr style="border-bottom: 2px solid #333;">
                <th style="text-align: left; padding: 10px;">Item</th>
                <th style="text-align: right; padding: 10px;">Preço</th>
            </tr>
        </thead>
        <tbody id="pdf-body"></tbody>
    </table>
    <h2 style="text-align: right; margin-top: 30px;">Total: R$ <span id="pdf-total">0,00</span></h2>
</div>

<div id="modal">
    <div class="modal-content">
        <h3>Novo Item</h3>
        <input type="text" id="in-nome" placeholder="Nome (ex: Picanha)">
        <input type="number" id="in-preco" step="0.01" inputmode="decimal" placeholder="Preço (ex: 89.90)">
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button onclick="fecharModal()" style="flex:1; background:#eee;">Cancelar</button>
            <button onclick="adicionarItem()" style="flex:1; background:var(--p); color:white;">Salvar</button>
        </div>
    </div>
</div>

<script>
    let itens = JSON.parse(localStorage.getItem('compras_bruno_v3') || '[]');

    function render() {
        const container = document.getElementById('lista-container');
        container.innerHTML = '';
        let total = 0;

        itens.forEach((item, index) => {
            if(item.checked) total += parseFloat(item.preco);
            
            const div = document.createElement('div');
            div.className = 'item-card';
            div.innerHTML = `
                <div class="item-info">
                    <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleCheck(${index})">
                    <span class="${item.checked ? 'strikethrough' : ''}">${item.nome}</span>
                </div>
                <div class="price-tag">R$ ${parseFloat(item.preco).toFixed(2).replace('.', ',')}</div>
            `;
            container.appendChild(div);
        });

        document.getElementById('display-total').innerText = total.toLocaleString('pt-BR', {minimumFractionDigits: 2});
        localStorage.setItem('compras_bruno_v3', JSON.stringify(itens));
    }

    function adicionarItem() {
        const nome = document.getElementById('in-nome').value;
        const preco = document.getElementById('in-preco').value;

        if(nome && preco) {
            itens.push({ nome, preco: parseFloat(preco), checked: true });
            fecharModal();
            render();
        }
    }

    function abrirModal() { 
        document.getElementById('modal').style.display = 'flex'; 
        document.getElementById('in-nome').focus();
    }
    
    function fecharModal() { 
        document.getElementById('modal').style.display = 'none';
        document.getElementById('in-nome').value = '';
        document.getElementById('in-preco').value = '';
    }

    function toggleCheck(index) {
        itens[index].checked = !itens[index].checked;
        render();
    }

    function reiniciarLista() {
        if(confirm("Zerar toda a lista?")) {
            itens = [];
            render();
        }
    }

    function gerarPDF() {
        const marcados = itens.filter(i => i.checked);
        if(marcados.length === 0) return alert("Marque pelo menos um item para finalizar!");

        // Preenche o template do PDF
        const dataAtual = new Date().toLocaleString('pt-BR');
        document.getElementById('pdf-data').innerText = `Gerado em: ${dataAtual}`;
        
        let htmlItens = '';
        let total = 0;
        marcados.forEach(i => {
            total += i.preco;
            htmlItens += `<tr style="border-bottom: 1px solid #eee;">
                <td style="padding: 10px;">${i.nome}</td>
                <td style="padding: 10px; text-align: right;">R$ ${i.preco.toFixed(2).replace('.', ',')}</td>
            </tr>`;
        });

        document.getElementById('pdf-body').innerHTML = htmlItens;
        document.getElementById('pdf-total').innerText = total.toLocaleString('pt-BR', {minimumFractionDigits: 2});

        // Configuração e Geração
        const elemento = document.getElementById('pdf-area');
        elemento.style.display = 'block'; // Mostra temporariamente para capturar

        const opt = {
            margin: 1,
            filename: `Compra_${new Date().toISOString().slice(0,10)}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(elemento).save().then(() => {
            elemento.style.display = 'none'; // Esconde de novo
        });
    }

    render();
</script>

</body>
</html>
