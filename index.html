<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lista de Compras Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --p: #27ae60; --bg: #f0f2f5; --danger: #e74c3c; --blue: #3498db; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 10px 10px 120px 10px; }
        
        .header { 
            position: sticky; top: 0; background: var(--p); color: white; 
            padding: 20px; border-radius: 0 0 20px 20px; text-align: center; 
            margin: -10px -10px 20px -10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); z-index: 100;
        }
        
        .total-val { font-size: 2.2rem; font-weight: 800; display: block; }
        
        .item-card { 
            background: white; border-radius: 12px; padding: 15px; margin-bottom: 10px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .item-info { display: flex; flex-direction: column; flex: 1; }
        .item-main { display: flex; align-items: center; }
        .item-details { font-size: 0.85rem; color: #7f8c8d; margin-left: 39px; margin-top: 2px; }
        
        input[type="checkbox"] { width: 24px; height: 24px; margin-right: 15px; accent-color: var(--p); }
        .strikethrough { text-decoration: line-through; color: #bbb; }

        .price-tag { text-align: right; min-width: 80px; }
        .subtotal { font-weight: bold; color: var(--p); font-size: 1.1rem; display: block; }

        .controls { 
            position: fixed; bottom: 0; left: 0; right: 0; background: white;
            display: flex; justify-content: space-around; padding: 15px 10px; gap: 8px;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.05);
        }

        button { border: none; border-radius: 12px; padding: 12px; font-weight: bold; cursor: pointer; }
        .btn-add { background: var(--p); color: white; flex: 2; }
        .btn-pdf { background: var(--blue); color: white; flex: 1.5; }
        .btn-reset { background: #eee; color: var(--danger); flex: 1; }

        #modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.5); z-index: 200; align-items: center; justify-content: center;
        }
        .modal-content { background: white; padding: 25px; border-radius: 20px; width: 85%; max-width: 400px; }
        .modal-content input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 10px; font-size: 1.1rem; box-sizing: border-box; }
        
        /* Estilo PDF */
        #pdf-area { font-family: Arial, sans-serif; padding: 20px; }
        .pdf-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .pdf-table th { background: #f2f2f2; padding: 10px; text-align: left; border-bottom: 2px solid #ddd; }
        .pdf-table td { padding: 10px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

<div class="header">
    <span style="opacity: 0.9;">Total no Carrinho</span>
    <span class="total-val">R$ <span id="display-total">0,00</span></span>
</div>

<div id="lista-container"></div>

<div class="controls">
    <button class="btn-reset" onclick="reiniciarLista()">Zerar</button>
    <button class="btn-pdf" onclick="gerarPDF()">Finalizar</button>
    <button class="btn-add" onclick="abrirModal()">+ Item</button>
</div>

<div id="modal">
    <div class="modal-content">
        <h3 style="margin-top:0">Novo Item</h3>
        <input type="text" id="in-nome" placeholder="Nome (ex: Arroz)">
        <div style="display: flex; gap: 10px;">
            <input type="number" id="in-qtd" placeholder="Qtd" value="1" style="flex: 1;">
            <input type="number" id="in-preco" step="0.01" inputmode="decimal" placeholder="Preço Un." style="flex: 2;">
        </div>
        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button onclick="fecharModal()" style="flex:1; background:#eee;">Voltar</button>
            <button onclick="adicionarItem()" style="flex:1; background:var(--p); color:white;">Adicionar</button>
        </div>
    </div>
</div>

<div id="pdf-area" style="display: none;">
    <h2 id="pdf-header" style="text-align: center; text-transform: uppercase; margin-bottom: 30px;"></h2>
    <table class="pdf-table">
        <thead>
            <tr>
                <th>Item</th>
                <th>Qtd</th>
                <th>V. Unit</th>
                <th style="text-align: right;">Total</th>
            </tr>
        </thead>
        <tbody id="pdf-body"></tbody>
    </table>
    <div style="text-align: right; margin-top: 30px; font-size: 1.4rem; font-weight: bold;">
        Total Geral: R$ <span id="pdf-total">0,00</span>
    </div>
</div>

<script>
    let itens = JSON.parse(localStorage.getItem('compras_bruno_v4') || '[]');

    function render() {
        const container = document.getElementById('lista-container');
        container.innerHTML = '';
        let totalCarrinho = 0;

        itens.forEach((item, index) => {
            const subtotal = item.qtd * item.preco;
            if(item.checked) totalCarrinho += subtotal;
            
            const div = document.createElement('div');
            div.className = 'item-card';
            div.innerHTML = `
                <div class="item-info">
                    <div class="item-main">
                        <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleCheck(${index})">
                        <span class="${item.checked ? 'strikethrough' : ''}" style="font-weight:600">${item.nome}</span>
                    </div>
                    <div class="item-details">
                        ${item.qtd}x R$ ${item.preco.toFixed(2).replace('.', ',')}
                    </div>
                </div>
                <div class="price-tag">
                    <span class="subtotal">R$ ${subtotal.toFixed(2).replace('.', ',')}</span>
                </div>
            `;
            container.appendChild(div);
        });

        document.getElementById('display-total').innerText = totalCarrinho.toLocaleString('pt-BR', {minimumFractionDigits: 2});
        localStorage.setItem('compras_bruno_v4', JSON.stringify(itens));
    }

    function adicionarItem() {
        const nome = document.getElementById('in-nome').value;
        const qtd = parseFloat(document.getElementById('in-qtd').value);
        const preco = parseFloat(document.getElementById('in-preco').value);

        if(nome && qtd > 0 && preco >= 0) {
            itens.push({ nome, qtd, preco, checked: true });
            fecharModal();
            render();
        } else {
            alert("Preencha todos os campos corretamente!");
        }
    }

    function abrirModal() { document.getElementById('modal').style.display = 'flex'; document.getElementById('in-nome').focus(); }
    function fecharModal() { document.getElementById('modal').style.display = 'none'; document.querySelectorAll('.modal-content input').forEach(i => i.value = (i.id==='in-qtd'?'1':'')); }
    function toggleCheck(index) { itens[index].checked = !itens[index].checked; render(); }
    function reiniciarLista() { if(confirm("Deseja iniciar uma nova lista?")) { itens = []; render(); } }

    function gerarPDF() {
        const marcados = itens.filter(i => i.checked);
        if(marcados.length === 0) return alert("Selecione os itens no carrinho primeiro!");

        const hoje = new Date();
        const dataFormatada = hoje.toLocaleDateString('pt-BR');
        document.getElementById('pdf-header').innerText = `LISTA DE COMPRAS DIA ${dataFormatada}`;
        
        let htmlBody = '';
        let totalGeral = 0;
        
        marcados.forEach(i => {
            const sub = i.qtd * i.preco;
            totalGeral += sub;
            htmlBody += `
                <tr>
                    <td>${i.nome}</td>
                    <td>${i.qtd}</td>
                    <td>R$ ${i.preco.toFixed(2).replace('.', ',')}</td>
                    <td style="text-align: right;">R$ ${sub.toFixed(2).replace('.', ',')}</td>
                </tr>`;
        });

        document.getElementById('pdf-body').innerHTML = htmlBody;
        document.getElementById('pdf-total').innerText = totalGeral.toLocaleString('pt-BR', {minimumFractionDigits: 2});

        const elemento = document.getElementById('pdf-area');
        elemento.style.display = 'block';

        const opt = {
            margin: 0.5,
            filename: `Lista_${dataFormatada.replace(/\//g, '-')}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 3 },
            jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(elemento).save().then(() => {
            elemento.style.display = 'none';
        });
    }

    render();
</script>

</body>
</html>
